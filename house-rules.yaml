units:
  emu_per_inch: 914400
  pt_per_inch: 72
  emu_per_pt: 12700
  epsilon_in: 1.0e-09
  bounds_round_in: 4
  bounds_tolerance_emu: 1000
notation:
  negative: '-'
  negative_forbidden:
  - △
  - ▲
  not_available:
  - '-'
  - 적자*
  unit_label: '[단위: 억원]'
  positive: +
  thousands_sep: ','
  decimal_sep: .
# ── STRUCT 게이트 (계획서 2.18) ───────────────────────────────────────
# 스킬의 preflight.py가 검사 20개를 한다. 그중 구조·규격만 STRUCT로 본다.
# 13~19는 shin 하우스 규칙이고 audit.py가 styles[style]로 이미 판정한다.
# 두 벌로 두면 갈라진다 (2.14). 버리는 것이 아니라 소유를 나누는 것이다.
#
# 분류를 번호가 아니라 "스타일이 소유한 문구"로 적는 이유:
#   preflight.py는 검사 번호를 출력하지 않는다. 문구밖에 단서가 없다.
#   그리고 목록에 없는 것을 전부 구조(=차단)로 보면, preflight.py에 검사가
#   새로 생겼을 때 아무도 분류하지 않아도 조용히 빠지지 않는다.
#   문구가 바뀌어 안 맞게 되면 corporate 장표에서 요란하게 틀린다 — 안 보이는
#   실패가 아니다. 조용한 PASS보다 시끄러운 FAIL이 낫다 (2.16-7).
preflight:
  source: skill/shin-ppt1/scripts/preflight.py
  # 이 문구로 시작하거나 이 문구를 담은 [오류]는 스타일 판정이다.
  # STRUCT 게이트는 세지 않는다. audit.py가 정본이다.
  # 오른쪽은 preflight.py 머리 CHECKS의 번호다 (사람이 보라고 적어 둔다)
  style_owned:
    - "표 본문 글씨"          # 13 shin 11.5pt 하한. corporate 표는 9pt다
    - "허용되지 않은 글꼴"     # 15 shin 2종. corporate는 fonts 절이 따로 있다
    - "중앙정렬이 아님"        # 16 표 1행·1열 중앙정렬
    - "하우스 팔레트"          # 17 corporate 색이 shin에 섞이는 것
    - "한 덱에서 테마를 섞었다" # 18 shin 테마 혼용
    - "본문이 각주 영역을 침범" # 19 각주 y좌표는 스타일마다 다르다
  # 14(각주 외 10pt)·12(지면 밖)·20(빈 상자)은 preflight가 [경고]로 낸다.
  # 경고는 게이트를 막지 않으므로 분류가 필요 없다

numeric_tokens:
  pattern: FY\d{2,4}E?|[+-]?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?%?
  global_text_whitelist:
  - name: fiscal_year_label
    pattern: ^FY\d{2,4}E?$
  - name: calendar_year_label
    pattern: ^(?:19|20)\d{2}E?$
  job_whitelist_fields:
  - slide
  - token
  - reason
manifest:
  schema_version: 1
  shape_name:
    claim_prefix: ''
    sep: /
    index_sep: '#'
  override_fields:
  - value
  - reason
  - author
  - at
  kinds:
  - numeric
  - text
  source_required: true
  # 라벨 셀 참조 (2026-09-03 신설, 하위 호환)
  #
  # 값 대조기는 숫자가 원천과 맞는지만 보고 **그 숫자가 어느 항목의 것인지는 안 본다.**
  # 표 1열 라벨 둘을 맞바꾸면 뜻이 정반대가 되는데 audit이 통과시켰다 (실측).
  # REVIEWER는 그림을 보고 잡았지만(L34), 스크립트로 잴 수 있으면 사람에게 맡기지 않는다.
  #
  # claim이 label_ref를 적으면 audit이 그 셀의 글자와 장표에 찍힌 라벨을 대조한다.
  # **없으면 검사를 건너뛴다** — 기존 잡의 manifest를 깨지 않기 위해서다.
  # 표가 아닌 그림(막대·선)에는 라벨 개념이 달라 강제하지 않는다.
  label_ref_optional: true

  # 차트 계열의 원천 (2026-09-03 신설)
  #
  # **네이티브 차트를 원칙으로 한다** (사용자 확정). 받는 사람이 더블클릭해 숫자를
  # 고칠 수 있고, 고치면 막대·선이 따라 바뀐다. 도형 기반 막대는 그게 안 된다.
  #
  # 그런데 네이티브 차트 값은 내장 워크북 안에 있어 claim에 안 걸린다. 지금 audit은
  # "그 값이 원천 시트 **어딘가**에 있나"만 본다. 거래대금 자리에 신용잔고 값을
  # 넣어도 통과한다 (2026-09-03 실측, LESSONS L38).
  # 원칙으로 삼는 순간 그게 장표의 기본이 되므로 계약을 만든다.
  #
  # 생성기가 계열마다 원천 범위를 적으면 audit이 **그 범위와만** 대조한다.
  # 안 적으면 시트 전체 대조로 떨어지고 경고를 남긴다 — 조용히 지나가지 않는다.
  chart_series_ref_optional: true
  source_ref_required_for:
  - identity
  transforms:
    identity: []
    sum:
    - range
    ratio:
    - numerator
    - denominator
    delta:
    - from
    - to
    cagr:
    - start
    - end
    - periods
    unverified:
    - note
issues:
  severity:
  - CRITICAL
  - MAJOR
  - MINOR
  action:
  - AUTO_FIX
  - USER_DECISION
  - REVIEW_ONLY
  type:
  - MESSAGE
  - LOGIC
  - DENSITY
  - STRUCTURE
  - UNSOURCED
  - DESIGN
  - READABILITY
  - SOURCE
  - CALC
  - LAYOUT
  - HOUSE_RULE
  editor_types:
  - MESSAGE
  - LOGIC
  - DENSITY
  - STRUCTURE
  - UNSOURCED
  - DESIGN
  - READABILITY

  # 검토는 한 사람(REVIEWER)이 하되 렌즈 두 개를 각각 보고해야 한다.
  #
  # 2026-08-30 신설. 그전에는 내용 렌즈만 있었고 디자인은 "스크립트가 판정한다"고
  # 프롬프트에 적어 두었다. 그 전제가 틀려서 결함 넷이 그대로 나갔다.
  # 사람을 둘로 늘리는 대신 출력 형식으로 강제한다 — 렌즈 하나라도 안 적으면
  # orchestrator가 ISSUE 게이트를 안 열어 준다.
  # "안 봤다"가 "봤는데 없다"로 둔갑하지 못하게 하는 것이 요점이다 (2.16-7).
  review_lenses:
    CONTENT:
    - MESSAGE
    - LOGIC
    - DENSITY
    - STRUCTURE
    - UNSOURCED
    DESIGN:
    - DESIGN
    - READABILITY
  editor_caps:
    CRITICAL: 3
    MAJOR: 5
  unsourced_severity: MINOR
  id_prefix:
    editor: E-
    audit: A-
  decision_action:
  - ACC
  - REJ
