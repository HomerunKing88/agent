units:
  emu_per_inch: 914400
  pt_per_inch: 72
  emu_per_pt: 12700
  epsilon_in: 1.0e-09
  bounds_round_in: 4
  bounds_tolerance_emu: 1000
notation:
  negative: '-'
  negative_forbidden:
  - △
  - ▲
  not_available:
  - '-'
  - 적자*
  unit_label: '[단위: 억원]'
  positive: +
  thousands_sep: ','
  decimal_sep: .
numeric_tokens:
  pattern: FY\d{2,4}E?|[+-]?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?%?
  global_text_whitelist:
  - name: fiscal_year_label
    pattern: ^FY\d{2,4}E?$
  - name: calendar_year_label
    pattern: ^(?:19|20)\d{2}E?$
  job_whitelist_fields:
  - slide
  - token
  - reason
manifest:
  schema_version: 1
  shape_name:
    claim_prefix: ''
    sep: /
    index_sep: '#'
  override_fields:
  - value
  - reason
  - author
  - at
  kinds:
  - numeric
  - text
  source_required: true
  source_ref_required_for:
  - identity
  transforms:
    identity: []
    sum:
    - range
    ratio:
    - numerator
    - denominator
    delta:
    - from
    - to
    cagr:
    - start
    - end
    - periods
    unverified:
    - note
issues:
  severity:
  - CRITICAL
  - MAJOR
  - MINOR
  action:
  - AUTO_FIX
  - USER_DECISION
  - REVIEW_ONLY
  type:
  - MESSAGE
  - LOGIC
  - DENSITY
  - STRUCTURE
  - UNSOURCED
  - SOURCE
  - CALC
  - LAYOUT
  - HOUSE_RULE
  editor_types:
  - MESSAGE
  - LOGIC
  - DENSITY
  - STRUCTURE
  - UNSOURCED
  editor_caps:
    CRITICAL: 3
    MAJOR: 5
  unsourced_severity: MINOR
  id_prefix:
    editor: E-
    audit: A-
  decision_action:
  - ACC
  - REJ
