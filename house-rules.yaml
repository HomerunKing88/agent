# house-rules.yaml — 하우스 스타일 규칙 단일 원천 (계획서 2.14)
#
# template.js(생성기)와 audit.py(검사기)는 규칙 값을 이 파일에서만 읽는다.
# 어느 쪽도 값을 자체 보유하지 않는다. 두 벌이 되면 생성기와 검사기가 갈라진다.
#
# 값 출처: corporate-strategy-ppt 스킬의
#   references/design-system.md ('26.7 최종본 + '26.8 폰트 이원화 확정)
#   references/qa-checklist.md
# 변경 시 Codex에게 알린다 (CLAUDE.md 담당 파일 절).

version: "2026.08"

# ── 검사 없는 규칙 (확정 2026-08-29) ──────────────────────────────────
# 아래 키는 이 파일에 값이 있지만 **아무 검사기도 읽지 않는다.**
# 규칙은 있는데 강제가 없는 상태를 문서에 안 적으면 "검사되고 있다"고 착각하게 된다.
# 여기 없는데 코드 참조가 0인 키가 생기면 e2e_check.py가 알린다.
# 검사에 넣기로 하면 이 목록에서 뺀다.
unenforced:
  - key: palette_usage.brand_swatch
    why: 브랜드 색 정의다. 검사 대상이 아니라 참고값이다
  - key: palette_usage.red_scope
    why: 검사 가능하다. 결론 줄(⇒ 접두) 판별이 필요해 red_max_per_line 다음 순서다
  - key: charts.grouped_bar.series_max
    why: template.js에 groupedBar 헬퍼가 아직 없다. 헬퍼를 만들 때 생성기 가드로 넣는다
  - key: limits.parallel_items_max
    why: 무엇을 "병렬 항목"으로 셀지 정의가 없다. 정의부터 정해야 검사가 된다
  - key: limits.diagrams_per_page_max
    why: 무엇을 "다이어그램"으로 셀지 정의가 없다. 위와 같은 이유다
  # ↓ 계획서 2.17 이행 중이다. shin-ppt1 값은 아직 읽는 코드가 없다.
  #   생성기·검사기가 이 스타일을 읽기 시작하면 아래 줄들을 지운다.
  - key: default_style
    why: 2.17 이행 중. shin-ppt1을 읽는 코드가 아직 없다
  - key: styles.shin-ppt1.themes.dense.accent
