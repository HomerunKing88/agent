lint:
  # 계획서 8절 LINT — 잡 스크립트가 헬퍼를 우회해 pptxgenjs를 직접 부르는 것을 막는다.
  # 우회하면 도형에 역할 이름이 안 붙어 audit이 그 도형을 아예 못 센다.
  # 규칙 값이므로 여기에만 둔다. lint_deck.js가 읽는다 (2.14).
  raw_calls:
    - pattern: '\.addText\s*\('
      why: 'tpl.text() · tpl.bullets() 를 써라 — 역할 이름이 안 붙는다'
    - pattern: '\.addTable\s*\('
      why: 'tpl.table() 을 써라 — 열 너비와 정렬이 규칙을 안 탄다'
    - pattern: '\.addShape\s*\('
      why: 'tpl.shape() · tpl.panel() 을 써라'
    - pattern: '\.addImage\s*\('
      why: 'tpl 헬퍼를 거쳐라'
    - pattern: '\.addChart\s*\('
      why: 'tpl.chartBar() · tpl.chartLine() 을 써라 — chartSeries 등록을 건너뛴다'
  # addSlide는 목록에 없다 — deckkit.newPres가 가로채 장 번호를 세므로 우회가
  # 아니고, template.js의 문서화된 사용법이기도 하다 (`const s = pres.addSlide()`).
  # pptxgenjs의 require도 위반이 아니다 — 잡이 모듈을 tpl.newPres(pptxgen, ...)에
  # 넘기는 것이 계약이다.
  #
  # 도형을 만드는 호출에 objectName이 붙어 있으면 통과시킨다. audit은 이름으로
  # 도형을 찾으므로 이름이 있으면 그 도형은 검사를 받는다 (`stat/label`이 실제로
  # role_min_pt를 타고 있다). **이름 없는 도형이 게이트를 우회하는 것**이 이 규칙이
  # 막으려는 것이지, 호출 형태 자체가 아니다.
  names_shape_ok: true

  # 사유를 적으면 통과시킨다. 사유 없는 예외는 없다 (계획서 8절 "사유 명시 예외 제외").
  exception_marker: 'lint-allow:'
