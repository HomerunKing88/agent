# house-rules.yaml — 하우스 스타일 규칙 단일 원천 (계획서 2.14)
#
# template.js(생성기)와 audit.py(검사기)는 규칙 값을 이 파일에서만 읽는다.
# 어느 쪽도 값을 자체 보유하지 않는다. 두 벌이 되면 생성기와 검사기가 갈라진다.
#
# 값 출처: corporate-strategy-ppt 스킬의
#   references/design-system.md ('26.7 최종본 + '26.8 폰트 이원화 확정)
#   references/qa-checklist.md
# 변경 시 Codex에게 알린다 (CLAUDE.md 담당 파일 절).

version: "2026.08"

# ── 단위·오차 (계획서 2.16-4) ─────────────────────────────────────────
# 생성기는 inch, pptx XML은 EMU, PowerPoint COM은 pt로 말한다.
# 환산 상수와 허용 오차를 세 곳이 각자 들고 있으면 같은 장표를 두고 판정이 갈린다.
units:
  emu_per_inch: 914400
  pt_per_inch: 72
  emu_per_pt: 12700
  epsilon_in: 1.0e-9        # 인치 실수 비교 허용치 (표 열너비 합 검증 등)
  bounds_round_in: 4        # manifest bounds를 적을 때 반올림 자릿수
  bounds_tolerance_emu: 1000  # manifest bounds ↔ XML 좌표 대조 허용 오차 (약 0.001in)

# ── 판형 ────────────────────────────────────────────────────────────
layout:
  name: A4L
  width: 11.6929          # in
  height: 8.2677
  margin_x: 0.65          # 좌우 여백
  content_width: 10.39    # CW = width - margin_x*2

# ── 폰트 ────────────────────────────────────────────────────────────
# '26.8 확정. design-system.md 판형·폰트 절의 "Arial 단일 지정"은 이 결정으로 대체됐다.
fonts:
  heading: HY헤드라인M     # 페이지 제목, 배너, Executive Summary 제목
  body: 맑은 고딕          # 그 밖의 전부 (표, 불릿, 카드, 캡션, 각주)
  allowed_count: 2         # 셋째 글꼴 금지
  heading_bold:            # heading 폰트를 bold로 쓰는 곳
    - page_title
    - banner
    - exec_summary_title
  heading_no_bold:         # heading 폰트를 bold 없이 쓰는 곳
    - section_chip         # 네이비 배경에서 굵게 하면 뭉개진다
    - exec_summary_bracket_heading
  heading_width_ratio: 1.15   # 맑은 고딕 대비 15~20% 넓다. 폭 예산은 하한값으로 잡는다

# ── 글자 크기 ────────────────────────────────────────────────────────
# 본문 10pt 미만 금지. 아래 예외만 허용한다.
sizes:
  body_min_pt: 10
  banner_pt: 15            # HY헤드라인M이 넓어 16 -> 15로 낮춤 ('26.8)
  banner_inline_paren_pt: 11
  page_title_pt: 17        # 확정 2026-08-28. design-system.md의 16은 이 값으로 대체
  chip_pt: 12
  chip_desc_pt: 10
  callout_number_pt: 12
  callout_compare_pt: [10, 11]
  subheader_pt: 10.5
  card_title_pt: 11.5
  cream_box_pt: 10
  dark_card_title_pt: 12
  dark_card_body_pt: 11
  kpi_delta_pt: 12
  draft_tag_pt: 8
  table_header_pt: 9       # 허용 8.5~9.5
  table_body_pt: 9         # 허용 8.5~9.5
  table_body_min_pt: 8.5
  table_caption_pt: 9
  footnote_pt: 8
  bullet_marker_pt: 10       # 확정 2026-08-29. 불릿 ▸ 마커는 본문과 같은 10pt.
                             # design-system.md의 9는 이 값으로 대체한다 (계획서 10절 해소)
  icon_badge_glyph_pt: 9     # 원형 배지 안 글리프. 마커와 별개 값이다.
                             # 전에는 bullet_marker_pt를 쓰고 있었다. 렌더 결과는 그대로 9pt
  chart_value_label_pt: 8.5   # 허용 7.5~8.5
  chart_axis_label_pt: 7.5
  waterfall_value_pt: 9.5
  stat_card_number_pt: 15    # 범위 15~22. template.js 기본값 15
  stat_card_label_pt: 10     # 확정 2026-08-28. template.js는 9.5였다 -> 10으로 올림

# ── 팔레트 ──────────────────────────────────────────────────────────
palette:
  navy:      "0D4D79"   # 제목선, 섹션 제목, 핵심 숫자, 배너/카드 배경, 표 헤더, 당사 막대
  amber:     "FFC000"   # 배너 결론 줄, 강조 숫자, 리테일/보조 계열. 페이지당 절제
  blue:      "0057D9"   # 증감·델타 수치 전용
  title:     "1F2937"   # 페이지 제목, 진한 본문
  body:      "3C4350"   # 일반 본문
  gray:      "6B7280"   # 각주, 보조 라벨
  grayLt:    "C4CAD2"   # 패널 테두리, 경쟁사 막대, 표 괘선
  steel:     "C9DAE8"   # 당사 열 배경, 다크카드 보조 텍스트
  tint:      "E7EEF4"   # 옅은 블루 박스, 당사 열 밴드
  tintLt:    "F1F5F9"   # 사용 자제 — 표 줄무늬 금지
  divLt:     "DDE1E6"   # 패널 내부 구분선, 옅은 그리드
  amberTint: "FFF1CC"   # 열위 표시 필요 시 (기본 미사용)
  cream:     "FFF2CC"   # 시사점 박스 배경
  creamBd:   "FFDC6D"   # 시사점 박스 테두리
  panel:     "F7F8FA"   # 불릿 블록 바탕
  panelBd:   "E8EBEF"
  tintBd:    "C9DAE8"   # steel과 같은 값. template.js가 두 이름을 다 쓴다
  white:     "FFFFFF"
  red:       "FF0000"   # 결론 "⇒" 구문, Executive Summary 키워드 전용

palette_usage:
  red_scope: [conclusion_line, exec_summary_keyword]
  red_max_per_line: 1
  brand_swatch: ["0D4D79", "602800", "FFC000", "FFDC6D", "FFF2CC"]

# ── 표기 ────────────────────────────────────────────────────────────
notation:
  negative: "-"              # △ 금지, 빨강 금지
  negative_forbidden: ["△", "▲"]
  not_available: ["-", "적자*"]
  unit_label: "[단위: 억원]"  # 대괄호 표기. 괄호 표기 금지 (계획서 6.1)
  # 숫자 표기. claim()의 표시 문자열과 audit.py의 토큰 파서가 같은 값을 봐야 한다. 추가 2026-08-29
  positive: "+"              # 증감 열의 양수 부호 (음수는 negative)
  thousands_sep: ","
  decimal_sep: "."

# ── 숫자 토큰 등록 검사 (계획서 2.6) ──────────────────────────────────
# 장표의 숫자는 claim placement이거나 아래 공통 문맥 예외, 또는 manifest의 잡별 예외여야 한다.
# 잡별 예외 형식: {slide: 1, token: "-100", reason: "예외 사유"}. 사유 없는 예외는 ERROR다.
numeric_tokens:
  pattern: '[+-]?(?:\d{1,3}(?:,\d{3})+|\d+)(?:\.\d+)?%?'
  global_text_whitelist:
    - { name: fiscal_year_label, pattern: '^FY\d{2,4}E?$' }
    - { name: calendar_year_label, pattern: '^(?:19|20)\d{2}E?$' }
  job_whitelist_fields: [slide, token, reason]

# ── manifest (계획서 2.4~2.8, 6.2) ───────────────────────────────────
# transform 어휘는 닫아 둔다 (계획서 2.5). 키가 type, 값이 그 type의 필수 인자다.
# template.js claim()이 이 목록으로 호출을 막고, audit.py가 같은 목록으로 재계산한다.
# 여기 없는 계산은 unverified로 표시하고 근거를 사람이 한 줄 적는다.
manifest:
  schema_version: 1                   # manifest 항목 구조의 버전. 구조가 바뀌면 올린다 (계획서 2.16-6)
  # 도형 이름 규약 (계획서 2.16-1). manifest.shape_id ↔ pptx XML의 도형 name이 대조 키다.
  # 값 도형 이름 = claim_prefix + shape_id, 구조 도형 이름 = "헬퍼<sep>역할".
  # 한 슬라이드에서 같은 이름이 겹치면 index_sep + 일련번호를 붙인다.
  # claim_prefix는 빈 문자열이다 — 계획서 2.16-1이 shape_id를 그대로 name으로 쓴다고 적었고
  # fixtures/golden_deck.js도 그렇게 만들고 있다. 구조 도형 이름에는 sep("/")가 반드시 들어가고
  # claim id에는 들어가지 않으므로 접두사 없이도 둘은 섞이지 않는다.
  shape_name:
    claim_prefix: ""
    sep: "/"
    index_sep: "#"
  # override 감사 (계획서 2.16-8). 넷이 다 있어야 "출처가 구버전"인지 "숨김 수정"인지 가른다.
  # at은 조정을 결정한 시각이고 호출부가 적는다. 빌드 시각을 넣으면 manifest가 비결정적이 된다.
  override_fields: [value, reason, author, at]
  kinds: [numeric, text]
  source_required: true               # unverified 제외 전 항목은 src·sheet가 있어야 한다
  source_ref_required_for: [identity] # identity의 근거 셀은 source.ref에 적는다 (계획서 6.2)
  transforms:
    identity:   []
    sum:        [range]
    ratio:      [numerator, denominator]
    delta:      [from, to]              # 확정 2026-08-29
    cagr:       [start, end, periods]
    unverified: [note]                  # 확정 2026-08-29. 어휘 밖 값은 여섯 번째 type으로 둔다

# ── 이슈 어휘 (계획서 2.7, 2.10, 6.3) ────────────────────────────────
# EDITOR 프롬프트·schemas/editor.py·orchestrator 라우터가 같은 목록을 본다.
# 세 곳이 각자 들고 있으면 EDITOR가 어휘 밖 값을 내도 아무도 못 잡는다.
issues:
  severity: [CRITICAL, MAJOR, MINOR]
  action:   [AUTO_FIX, USER_DECISION, REVIEW_ONLY]
  type:     [MESSAGE, LOGIC, DENSITY, STRUCTURE, UNSOURCED, SOURCE, CALC, LAYOUT, HOUSE_RULE]
  # EDITOR가 낼 수 있는 type. 나머지는 audit.py가 결정적으로 판정하는 영역이다 (2.10)
  editor_types: [MESSAGE, LOGIC, DENSITY, STRUCTURE, UNSOURCED]
  # 지적 개수 상한 (9절 8단계). 상한이 없으면 사소한 지적이 수십 개 나온다
  editor_caps: { CRITICAL: 3, MAJOR: 5 }
  # 숫자 없는 외부 주장은 한 카테고리로 묶고 등급을 고정한다 (2.6)
  unsourced_severity: MINOR
  id_prefix: { editor: "E-", audit: "A-" }
  # 사용자 결정 어휘 (user_decision.json). slack_bot이 쓰고 게이트가 읽는다
  decision_action: [ACC, REJ]

# ── 표 ──────────────────────────────────────────────────────────────
table:
  default_align: center          # 전 셀 중앙정렬이 기본
  header_align: center           # 예외 없음. 긴 서술문 열이어도 헤더는 중앙
  long_text_col_align: left      # 셀 안에서 줄바꿈되는 긴 서술문 열에만
  short_phrase_left_align: false # 단어~10자 짧은 구절은 좌측정렬 금지
  row_height_min: 0.33           # 1줄. 0.30 이하는 PowerPoint가 0.347로 늘려 아래 요소와 겹친다
  row_height_2line_min: 0.58
  below_table_gap: 0.10          # 표 아래 요소는 top + Σ rowH + 0.10 이후
  zebra_stripes: false           # 바탕 흰색 통일
  own_column_fill: steel         # 당사 열만 하늘색 + navy bold
  subtotal_row_style: bold_no_fill
  colw_sum_must_equal_width: true

# ── 영역·좌표 ────────────────────────────────────────────────────────
zones:
  title_right_clear: true    # 제목 우상단 비움. 본부명·날짜 표기 없음
  title_underline: false     # 제목 아래 구분선 없음 (배너가 구분 역할)
  footnote_bottom_y: 7.70    # 바닥 기준선. y = 7.70 - 0.14 × 줄수
  footnote_line_step: 0.14   # 1줄 7.56 / 2줄 7.42 / 3줄 7.28
  footnote_max_lines: 4
  footnote_divider: false    # 하단 구분선 없음
  master_bottom_rule_y: 7.83 # 공식 양식 마스터 하단 가로선. 넘지 않는다
  content_max_y: 7.78
  # content_max_y는 본문 요소에만 적용한다. 아래는 규칙이 그 아래 두라고 지정한 요소이므로
  # 검사에서 제외한다. 제외하지 않으면 모든 덱이 FAIL 난다.
  content_max_y_exempt: [draft_tag]
  draft_tag_xy: [8.4, 8.0]     # 우하단. h 0.2 이므로 하단은 8.20

# ── 컴포넌트 좌표 ────────────────────────────────────────────────────
components:
  page_title:  { x: 0.65, y: 0.52, h: 0.34, color: title, valign: middle }
  banner:      { x: 0.65, y: 1.06, h: 0.82, line_spacing: 1.20, max_chars_per_line: 36 }
  chip:        { w: 1.95, h: 0.30, radius: 0.05, width_formula: "글자수 * 0.20 + 0.35",
                 desc_gap: 0.10, desc_w: 5.2 }   # desc_w는 상한. 우측 여백을 넘으면 줄인다
  chip_content_gap: 0.35     # 칩 아래 y+0.35부터 콘텐츠
  bullet_panel_indent: 0.16
  icon_badge: { diameter: 0.34, fills: [navy, tint], uniform: true }   # 표준. 확정 2026-08-28
  kpi_card: { w: 2.26, h: 1.08 }
  cream_box:   { fill: cream, line: creamBd, text_color: "000000", bold: false }
  bullet_panel: { fill: panel, line: panelBd }
  body_line_spacing: 1.22
  bullet_line_spacing: 1.15
  footnote_line_spacing: 1.12
  stat_label_line_spacing: 1.05
  bullet_step: 0.33
  bullet_marker: "▸"
  conclusion_prefix: "⇒"
  stroke_width: 0.75          # 패널·박스·표 테두리 공통
  rule_thickness: 0.012       # 구분선·baseline
  divider_thickness: 0.016    # 각주 상단선(opts.line 사용 시)
  padding: { banner_x: 0.15, cream_x: 0.20, dark_card_x: 0.18, panel_title_x: 0.15 }
  table_caption_prefix: "* "
  footnote_markers: ["※", "*", "**"]

# ── 차트 ────────────────────────────────────────────────────────────
charts:
  stack100:
    slot: [0.55, 0.86]         # 허용 범위
    bar_w: [0.40, 0.52]
    slot_default: 0.57         # template.js 실제 기본값
    bar_w_default: 0.40
  grouped_bar: { bar_w: [0.20, 0.30], series_max: 2 }
  gridlines: false           # 축은 baseline만 (grayLt)
  own_series_band: tint      # 당사 막대 뒤 배경 밴드
  stack_label_on_amber_or_gray: title   # 1F2937
  stack_label_on_navy: "FFFFFF"
  avg_line: { color: blue, width_pt: 1, dash: dash, label_pt: 7.5, label_bold: true }
  waterfall: { actual: navy, delta: amber, hypothetical: grayLt, tick_color: divLt }
  range_bar: { own: amber, peer: grayLt }

# ── 한도 ────────────────────────────────────────────────────────────
limits:
  parallel_items_max: 3
  diagrams_per_page_max: 3

# ── 금지 ────────────────────────────────────────────────────────────
forbidden:
  - marker_on_conclusion_line   # "⇒ 결론" 줄 앞 ▸ (화살표가 이미 마커)
  - table_zebra_stripes
  - negative_triangle           # △ 표기
  - negative_red                # 음수 빨강
  - title_underline
  - footnote_divider
  - hangul_char_split_in_shape  # 도형 안 글자 단위 파단 ("적립/금")
  - third_font
  - dark_emphasis_card          # 사용 자제. 크림 박스로 대체

# ── 렌더 검증 임계값 (qa-checklist.md) ────────────────────────────────
qa:
  page_height_pt: 595.2
  text_max_ymax_pt: 593         # 2pt 여유
  master_page_number_ymax_pt: 587   # 오탐 주의. 마스터 요소
  colw_tolerance_emu: 10000
  canvas_overflow_tolerance_in: 0.01
  render_dpi: 150
  dark_pixel_sum_threshold: 330    # RGB 합. 이보다 어두우면 글자 획으로 본다
  dark_pixel_min_count: 1000       # 본문 영역에 이만큼 없으면 글자가 배경에 묻힌 것
