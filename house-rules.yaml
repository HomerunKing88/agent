# house-rules.yaml — 하우스 스타일 규칙 단일 원천 (계획서 2.14, 2.17)
#
# 스타일이 둘이다. 기본은 shin-ppt1, "경전실 양식으로" 지정하면 corporate-strategy-ppt.
#
#   최상위       파이프라인 어휘. 스타일과 무관하다.
#                units notation numeric_tokens manifest issues unenforced version
#                생성기와 검사기를 잇는 계약이지 스타일이 아니다 (2.17).
#   styles.<이름>  스타일 규칙. 스킬이 다르면 다른 값이다.
#
# 생성기는 자기 STYLE의 절만 읽고, 검사기는 manifest의 style로 절을 고른다.
# 스타일을 모르는 채로 판정하지 않는다 — 틀린 기준으로 낸 PASS가 된다 (2.16-7).
#
# 2026-08-29: 최상위 스타일 절과 앵커를 제거했다. 나눌 때 한꺼번에 깨지지 않으려고
# 앵커로 다리를 놓아 뒀는데, 읽는 쪽(template.js·template_shin.js·deck.js·audit.py)이
# 전부 styles로 옮겨 다리가 필요 없어졌다.

version: '2026.08'
unenforced:
- key: palette_usage.brand_swatch
  why: 브랜드 색 정의다. 검사 대상이 아니라 참고값이다
- key: palette_usage.red_scope
  why: 검사 가능하다. 결론 줄(⇒ 접두) 판별이 필요해 red_max_per_line 다음 순서다
- key: styles.shin-ppt1.palette_usage.red_scope
  why: 빈 목록이다. shin은 빨강을 쓰지 않으므로 범위를 정할 것이 없다. red_max_per_line 0이 실질적인 규칙이고 그건 검사된다
- key: charts.grouped_bar.series_max
  why: template.js에 groupedBar 헬퍼가 아직 없다. 헬퍼를 만들 때 생성기 가드로 넣는다
- key: limits.parallel_items_max
  why: 무엇을 "병렬 항목"으로 셀지 정의가 없다. 정의부터 정해야 검사가 된다
- key: limits.diagrams_per_page_max
  why: 무엇을 "다이어그램"으로 셀지 정의가 없다. 위와 같은 이유다
- key: default_style
  why: 2.17 이행 중. shin-ppt1을 읽는 코드가 아직 없다
